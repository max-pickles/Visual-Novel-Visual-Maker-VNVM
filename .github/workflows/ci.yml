name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json
          npx tsc --noEmit -p tsconfig.e2e.json
      - run: npm test
      - name: Build
        run: npx vite build

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm rust webkit2gtk-4.1 gtk3 hicolor-icon-theme
      - uses: actions/checkout@v4
      - name: Build the package
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"
      - name: Install and check the package
        run: |
          pacman -U --noconfirm packaging/arch/vnvmaker-*.pkg.tar.zst
          pacman -Ql vnvmaker
          test -f /usr/lib/VNVMaker/templet/game/gui.rpy
          test -f /usr/share/applications/VNVMaker.desktop
          if ldd /usr/bin/vnvmaker | grep "not found"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vnvmaker-arch-package
          path: packaging/arch/vnvmaker-*.pkg.tar.zst

  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

  renpy:
    name: Ren'Py lint and playthrough
    runs-on: ubuntu-24.04
    env:
      RENPY_TAG: 8.5.2.26010301
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Ren'Py build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12-dev libassimp-dev libavcodec-dev libavformat-dev \
            libswresample-dev libswscale-dev libharfbuzz-dev libfreetype6-dev libfribidi-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libjpeg-dev pkg-config xvfb
          pipx install uv
      - name: Cache the Ren'Py build
        id: renpy-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renpy
          key: renpy-${{ env.RENPY_TAG }}-ubuntu-24.04
      - name: Build Ren'Py
        if: steps.renpy-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$RENPY_TAG" https://github.com/renpy/renpy "$RUNNER_TEMP/renpy"
          cd "$RUNNER_TEMP/renpy"
          uv sync --python /usr/bin/python3.12
          ./run.sh --build
      - name: Lint and play compiled projects
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a scripts/check-renpy.sh "$RUNNER_TEMP/renpy"
